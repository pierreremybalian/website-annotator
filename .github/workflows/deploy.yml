name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 51f39b9c1946569858d6ff3b2aac2baa
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter @annotate/widget build

      # Worker secrets (Trello key, encryption keys) live in Cloudflare and survive deploys;
      # scripts/deploy.sh is only needed to rotate them.
      - name: Apply D1 migrations
        if: env.HAS_TOKEN == 'true'
        working-directory: packages/worker
        run: npx wrangler d1 migrations apply annotate --remote
      - name: Deploy Worker
        if: env.HAS_TOKEN == 'true'
        working-directory: packages/worker
        run: npx wrangler deploy
      - name: Health check
        if: env.HAS_TOKEN == 'true'
        run: curl -fsS https://annotate.pierre-51f.workers.dev/health
