name = "annotate"
main = "src/index.ts"
account_id = "51f39b9c1946569858d6ff3b2aac2baa" # Pierre@baliandesign.com's Account
compatibility_date = "2026-08-15"
compatibility_flags = ["nodejs_compat"]

# The dashboard's address. workers.dev keeps working too: widget tags, the WP plugin and .annotate.json files point at it.
routes = [{ pattern = "annotate.balian.dev", custom_domain = true }]
# Routes turn workers.dev off unless it is asked for.
workers_dev = true

[dev]
port = 8787
# Without this, `wrangler dev` hands the Worker requests addressed to the route's host (annotate.balian.dev).
host = "localhost:8787"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "annotate"
database_id = "067a43d8-ea02-47f1-87e7-8f16efb965d5"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "SCREENSHOTS"
bucket_name = "annotate-screenshots"

# Retries failed pushes to Trello, imports pre-0.3 comments and pulls one board per run (src/cron.ts).
[triggers]
crons = ["*/10 * * * *"]

[vars]
# Public base URL of this Worker; used for Trello return_url, webhook callbacks and signed screenshot URLs.
PUBLIC_URL = "https://annotate.pierre-51f.workers.dev"
# Trello workspace (organization) id whose members may connect boards. Empty = anyone (dev only).
ALLOWED_TRELLO_ORG = ""
# "1" = in-memory fake Trello + /dev routes. Local only: set it in .dev.vars, never here.
TRELLO_MOCK = "0"
# Login emails go through Resend; .dev.vars sets "log" (kept in memory, shown at /dev/mail).
MAIL_PROVIDER = "resend"
MAIL_FROM = "Annotate <login@balian.dev>"
# Resend's free 100 a day is shared with balian.dev.
MAIL_DAILY_CAP = "50"
# "open" = anyone can log in and create an org. Closed until connecting projects asks for an Annotate login.
SIGNUP_MODE = "closed"

# Secrets (wrangler secret put ... / .dev.vars locally):
#   TRELLO_KEY, TRELLO_SECRET, TOKEN_ENC_KEY (base64, 32 bytes), SIGNING_SECRET, RESEND_API_KEY
